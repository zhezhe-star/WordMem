    completed document'
- id: T04
  milestone: M1
  title: 统一导入失败弹窗（翻译）
  status: complete
  acceptance:
  - DocumentImportReviewScreen 根部只有一个 .alert(item:)；模块内无重试按钮
  - 翻译最终失败（文档失败或 chip 缺失）弹一次窗，主按钮“重试”一次性重启文档与全部缺失 chip，次按钮“取消导入”
  - 不提供“暂不翻译”选项；取消导入不写入任何词条
  - 取消路径：文字导入回到编辑器并保留草稿；图片导入回到已选图片+原文预览并保留图片；不关闭导入 sheet
  - 取消路径：Translation Provider 退出组件；Share Extension 关闭扩展
  - unsupported 弹信息型弹窗，只有“知道了”，无重试
  - 用户点“取消导入”后退出流程且不重复弹；正常翻译中不弹
  - 保存路径仍使用 model.chipTranslations，无 schema 变化
  - 模型测试覆盖：单次弹窗、重试重启全流程、取消导入不落库
  evidence:
  - single .alert(item:); translation failure alert retry/cancel; unsupported info
    alert; 31 model tests pass
